[pytest]
testpaths = tests
addopts = -p no:cacheprovider -ra
markers =
    data: needs the local research data (data/tiles, data/masks, ...); skipped when absent
    model: loads the trained checkpoint (models/unet_r34.pt)
    slow: full-area inference or other runs over ~10 s
filterwarnings =
    ignore:Geometry is in a geographic CRS:UserWarning
